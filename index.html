<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Οι Φωτογραφίες μου</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    padding: 20px;
}
.gallery img {
    width: 100%;
    border-radius: 10px;
}
</style>

</head>
<body>

<h1>📸 Οι Φωτογραφίες μου</h1>

<div class="gallery">
    <img src="images/photo1.jpg">
    <img src="images/photo2.jpg">
</div>

</body>
</html>
